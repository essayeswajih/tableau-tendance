services:
  postgres:
    image: postgres:18
    container_name: tableau-tendance-postgres
    environment:
      POSTGRES_DB: tableau_tendance
      POSTGRES_USER: tableau_tendance
      POSTGRES_PASSWORD: tableau_tendance_password
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableau_tendance -d tableau_tendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tableau-tendance-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tableau_tendance:tableau_tendance_password@postgres:5432/tableau_tendance
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      JWT_SECRET_KEY: change-this-secret-in-production
      JWT_EXPIRE_MINUTES: 10080
      ADMIN_EMAIL: admin@tableau-tendance.tn
      ADMIN_PASSWORD: admin12345
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: tableau-tendance-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm start -- --host 0.0.0.0 --proxy-config proxy.conf.json

volumes:
  frontend_node_modules:
  postgres18_data:

