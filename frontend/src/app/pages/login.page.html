<main class="login-page">
  <section class="login-shell">
    <div class="login-copy">
      <p class="eyebrow">Administration</p>
      <h1>Connexion admin</h1>
      <p>
        Accédez au tableau de bord Tableau Tendance pour gérer les commandes et
        les demandes client.
      </p>
      <a routerLink="/">Retour au site</a>
    </div>

    <form class="login-panel" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <h2>Accès sécurisé</h2>
        <p>Utilisez votre compte administrateur.</p>
      </div>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        <span>Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="form-error">{{ error() }}</p>
      }

      <button class="button button-primary" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </section>
</main>
